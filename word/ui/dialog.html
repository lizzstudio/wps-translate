<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family:"Microsoft YaHei",sans-serif; background:#f5f6fa; padding:16px; }
.title { color:#1f3864; font-size:15px; margin-bottom:10px; }
.label { font-size:13px; color:#666; margin-bottom:4px; }
.box { background:#fff; border:1px solid #e3e6ee; border-radius:6px; padding:10px; font-size:14px; margin-bottom:12px; word-break:break-all; line-height:1.5; min-height:40px; }
#dst { background:#f0f7ff; border-color:#bcd9f5; }
.hint { font-size:11px; color:#999; }
</style>
</head>
<body>
<div class="title">📖 文档智能翻译
  <button onclick="topMost()" style="float:right;padding:3px 12px;border:none;border-radius:5px;background:#1f3864;color:#fff;cursor:pointer;margin-left:6px;">置顶</button>
  <button onclick="closeDlg()" style="float:right;padding:3px 12px;border:none;border-radius:5px;background:#c0392b;color:#fff;cursor:pointer;">关闭</button>
</div>
<div style="margin-bottom:10px;">
  <label style="font-size:13px;color:#666;">翻译为</label>
  <select id="target" style="padding:5px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px;">
    <option value="auto" selected>自动（随源语言）</option>
    <option value="zh">中文</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="es">Español</option>
    <option value="ru">Русский</option>
    <option value="pt">Português</option>
    <option value="ar">العربية</option>
    <option value="it">Italiano</option>
    <option value="nl">Nederlands</option>
    <option value="pl">Polski</option>
    <option value="tr">Türkçe</option>
    <option value="th">ไทย</option>
    <option value="vi">Tiếng Việt</option>
    <option value="id">Bahasa Indonesia</option>
  </select>
</div>
<div class="label">原文</div>
<div class="box" id="src">在文档中选中文字，自动翻译…</div>
<div class="label">译文</div>
<div class="box" id="dst">—</div>
<div class="hint">选中文字即自动翻译；未激活或未填 Key 请打开「设置」；右键可"置顶固定"</div>

<div id="ctxMenu" style="display:none;position:fixed;background:#fff;border:1px solid #d0d5dd;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:4px 0;z-index:9999;min-width:130px;font-size:13px;">
  <div onclick="ctxTop()" style="padding:7px 14px;cursor:pointer;">📌 置顶固定</div>
</div>
<script>
var busy = false, lastSel = '';

function getSelectionText() {
    try {
        var sel = window.Application.Selection;
        if (!sel) return '';
        var t = '';
        try { t = sel.Text || ''; } catch (e) { t = ''; }
        return t.replace(/[\r\n\b]/g, ' ').trim();
    } catch (e) { return ''; }
}
var LANG = { auto: '自动', zh: '中文', en: 'English', ja: '日本語', ko: '한국어', fr: 'Français', de: 'Deutsch',
             es: 'Español', ru: 'Русский', pt: 'Português', ar: 'العربية',
             it: 'Italiano', nl: 'Nederlands', pl: 'Polski', tr: 'Türkçe',
             th: 'ไทย', vi: 'Tiếng Việt', id: 'Bahasa Indonesia' };
function getTarget(text) {
    var t = document.getElementById('target').value;
    if (t && t !== 'auto' && LANG[t]) return LANG[t];
    return /[一-鿿]/.test(text) ? '英文' : '中文';
}

async function doTranslate(text, key) {
    var url = localStorage.getItem('wps_translate_api') || 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
    if (url.indexOf('/chat/completions') < 0) url = url.replace(/\/+$/, '') + '/chat/completions';
    var resp = await fetch(url, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({
            model: localStorage.getItem('wps_translate_model') || 'glm-4-flash',
            messages: [{ role: 'user', content: '请把下面的内容翻译成' + getTarget(text) + '，只输出翻译结果，不要任何解释：\n' + text }],
            temperature: 0.1
        })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    return data.choices[0].message.content.trim();
}

async function tick() {
    var text = getSelectionText();
    if (!text || text === lastSel || busy) return;
    lastSel = text;
    document.getElementById('src').textContent = text.length > 2000 ? text.slice(0, 2000) + '…' : text;
    document.getElementById('dst').textContent = '翻译中…';
    busy = true;
    try {
        var key = localStorage.getItem('wps_translate_key');
        if (!key) { document.getElementById('dst').textContent = '⚠️ 请先打开「设置」填写 API Key'; return; }
        document.getElementById('dst').textContent = await doTranslate(text, key);
    } catch (e) {
        document.getElementById('dst').textContent = '翻译失败：' + e.message;
    } finally { busy = false; }
}

window.onload = function () {
    localStorage.setItem('wps_dialog_open', '1');
    setInterval(tick, 1500);
    // 切换目标语言后立即重新翻译当前选中
    document.getElementById('target').addEventListener('change', function () { lastSel = ''; tick(); });
};
// 弹窗内"关闭"按钮：清标记 + 尝试关闭
function closeDlg() {
    localStorage.setItem('wps_dialog_open', '0');
    try { window.close(); } catch (e) {}
}

// 右键自定义菜单：置顶固定
document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var m = document.getElementById('ctxMenu');
    m.style.display = 'block';
    m.style.left = e.clientX + 'px';
    m.style.top = e.clientY + 'px';
});
document.addEventListener('click', function () { document.getElementById('ctxMenu').style.display = 'none'; });
function ctxTop() { document.getElementById('ctxMenu').style.display = 'none'; topMost(); }

// 弹窗内"置顶"按钮：用 Windows API 把弹窗固定到最前（不被正文覆盖）
function toUTF16B64(str) {
    var bytes = [];
    for (var i = 0; i < str.length; i++) { var c = str.charCodeAt(i); bytes.push(c & 0xff, c >> 8); }
    var bin = '';
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    return btoa(bin);
}
function topMost() {
    try {
        var ps = "Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class W{[DllImport(\"user32.dll\")]public static extern bool SetWindowPos(System.IntPtr h,System.IntPtr a,int x,int y,int cx,int cy,uint f);}'\n$p=Get-Process|Where-Object{$_.MainWindowTitle -like '*文档智能翻译*'}\nif($p){[W]::SetWindowPos($p.MainWindowHandle,[System.IntPtr](-1),0,0,0,0,3)}";
        if (typeof wps !== 'undefined' && wps.OAAssist && wps.OAAssist.ShellExecute) {
            wps.OAAssist.ShellExecute('powershell -NoProfile -EncodedCommand ' + toUTF16B64(ps));
            alert('已点击置顶，请查看弹窗是否固定在最前');
        } else { alert('当前环境不支持自动置顶'); }
    } catch (e) { alert('置顶失败：' + e.message); }
}
</script>
</body>
</html>
